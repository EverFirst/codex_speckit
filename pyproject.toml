[project]
name = "todo-api"
version = "0.1.0"
description = "Single-user TODO REST API built with FastAPI + SQLAlchemy Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn>=0.23,<0.31",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.12,<2.0",
    "pydantic>=2.4,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "black>=23.10,<24.0",
    "isort>=5.12,<6.0",
    "httpx>=0.25,<0.26",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
    "ignore:transaction already deassociated from connection:sqlalchemy.exc.SAWarning",
]
